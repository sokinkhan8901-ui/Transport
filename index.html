<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transport Business Register</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

header {
  background: #1f4e78;
  color: white;
  padding: 18px;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 25px;
}

.container {
  padding: 18px;
}

.new-btn,
.save-btn,
.cancel-btn,
.delete-btn {
  border: none;
  padding: 11px 18px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 15px;
  margin: 5px;
}

.new-btn {
  background: #198754;
  color: white;
}

.save-btn {
  background: #0d6efd;
  color: white;
}

.cancel-btn {
  background: #6c757d;
  color: white;
}

.delete-btn {
  background: #dc3545;
  color: white;
}

.form-area {
  display: none;
  background: white;
  padding: 18px;
  margin-top: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 8px #ccc;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.form-grid input {
  width: 100%;
  padding: 11px;
  border: 1px solid #bbb;
  border-radius: 6px;
  font-size: 14px;
}

.table-area {
  margin-top: 20px;
  background: white;
  border-radius: 10px;
  padding: 10px;
  overflow-x: auto;
  box-shadow: 0 2px 8px #ccc;
}

table {
  width: 100%;
  min-width: 1500px;
  border-collapse: collapse;
}

th,
td {
  border: 1px solid #ddd;
  padding: 9px;
  text-align: center;
  white-space: nowrap;
}

th {
  background: #1f4e78;
  color: white;
}

tr:nth-child(even) {
  background: #f7f7f7;
}

.empty {
  padding: 25px;
  text-align: center;
  color: #777;
}

@media (max-width: 800px) {
  .form-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <h1>🚚 Transport Business Register</h1>
</header>

<div class="container">

  <button class="new-btn" onclick="showForm()">+ New Entry</button>

  <div class="form-area" id="formArea">

    <div class="form-grid">

      <input type="date" id="date">

      <input type="text" id="broker" placeholder="Broker Name">

      <input type="text" id="driver" placeholder="Driver Name">

      <input type="text" id="truck" placeholder="Lori / Truck No.">

      <input type="text" id="from" placeholder="From Place">

      <input type="text" id="to" placeholder="To Place">

      <input type="number" id="weight" placeholder="Weight (Ton)">

      <input type="number" id="rate" placeholder="Rate (₹/Ton)">

      <input type="number" id="diesel" placeholder="Diesel (₹)">

      <input type="number" id="cash" placeholder="Cash (₹)">

      <input type="number" id="brokerPayment" placeholder="Broker Payment (₹)">

      <input type="number" id="driverPayment" placeholder="Driver Payment (₹)">

    </div>

    <br>

    <button class="save-btn" onclick="addEntry()">Save Entry</button>

    <button class="cancel-btn" onclick="hideForm()">Cancel</button>

  </div>


  <div class="table-area">

    <table>

      <thead>
        <tr>
          <th>Date</th>
          <th>Broker Name</th>
          <th>Driver Name</th>
          <th>Lori / Truck No.</th>
          <th>From Place</th>
          <th>To Place</th>
          <th>Weight</th>
          <th>Rate</th>
          <th>Total Freight</th>
          <th>Diesel</th>
          <th>Cash</th>
          <th>Broker Payment</th>
          <th>Driver Payment</th>
          <th>Broker Balance</th>
          <th>Driver Balance</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>

    </table>

  </div>

</div>


<script>

let entries = JSON.parse(
  localStorage.getItem("transportEntries")
) || [];


function showForm() {

  document.getElementById("formArea").style.display = "block";

  const dateInput = document.getElementById("date");

  if (!dateInput.value) {

    dateInput.value =
      new Date().toISOString().split("T")[0];

  }

}


function hideForm() {

  document.getElementById("formArea").style.display = "none";

}


function addEntry() {

  const date =
    document.getElementById("date").value;

  const broker =
    document.getElementById("broker").value.trim();

  const driver =
    document.getElementById("driver").value.trim();

  const truck =
    document.getElementById("truck").value.trim();

  const from =
    document.getElementById("from").value.trim();

  const to =
    document.getElementById("to").value.trim();

  const weight =
    Number(document.getElementById("weight").value) || 0;

  const rate =
    Number(document.getElementById("rate").value) || 0;

  const diesel =
    Number(document.getElementById("diesel").value) || 0;

  const cash =
    Number(document.getElementById("cash").value) || 0;

  const brokerPayment =
    Number(document.getElementById("brokerPayment").value) || 0;

  const driverPayment =
    Number(document.getElementById("driverPayment").value) || 0;


  if (!date) {
    alert("Please select Date");
    return;
  }


  const totalFreight = weight * rate;


  const brokerBalance =
    totalFreight - brokerPayment;


  const driverBalance =
    cash - driverPayment;


  const entry = {

    date,
    broker,
    driver,
    truck,
    from,
    to,
    weight,
    rate,
    totalFreight,
    diesel,
    cash,
    brokerPayment,
    driverPayment,
    brokerBalance,
    driverBalance

  };


  entries.push(entry);


  localStorage.setItem(
    "transportEntries",
    JSON.stringify(entries)
  );


  renderTable();

  clearForm();

  hideForm();

  alert("Entry Saved Successfully!");

}


function clearForm() {

  document.getElementById("broker").value = "";
  document.getElementById("driver").value = "";
  document.getElementById("truck").value = "";
  document.getElementById("from").value = "";
  document.getElementById("to").value = "";
  document.getElementById("weight").value = "";
  document.getElementById("rate").value = "";
  document.getElementById("diesel").value = "";
  document.getElementById("cash").value = "";
  document.getElementById("brokerPayment").value = "";
  document.getElementById("driverPayment").value = "";

}


function formatMoney(value) {

  return "₹" + Number(value || 0).toLocaleString("en-IN");

}


function renderTable() {

  const tbody =
    document.getElementById("tableBody");

  tbody.innerHTML = "";


  if (entries.length === 0) {

    tbody.innerHTML =
      '<tr><td colspan="16" class="empty">No entries yet. Click "+ New Entry" to add one.</td></tr>';

    return;

  }


  entries.forEach(function(entry, index) {

    const row =
      document.createElement("tr");


    const values = [

      entry.date,
      entry.broker,
      entry.driver,
      entry.truck,
      entry.from,
      entry.to,
      entry.weight,
      formatMoney(entry.rate),
      formatMoney(entry.totalFreight),
      formatMoney(entry.diesel),
      formatMoney(entry.cash),
      formatMoney(entry.brokerPayment),
      formatMoney(entry.driverPayment),
      formatMoney(entry.brokerBalance),
      formatMoney(entry.driverBalance)

    ];


    values.forEach(function(value) {

      const cell =
        document.createElement("td");

      cell.textContent = value;

      row.appendChild(cell);

    });


    const actionCell =
      document.createElement("td");


    const deleteButton =
      document.createElement("button");

    deleteButton.textContent = "Delete";

    deleteButton.className = "delete-btn";

    deleteButton.onclick =
      function() {
        deleteEntry(index);
      };


    actionCell.appendChild(deleteButton);

    row.appendChild(actionCell);

    tbody.appendChild(row);

  });

}


function deleteEntry(index) {

  if (confirm("Delete this entry?")) {

    entries.splice(index, 1);

    localStorage.setItem(
      "transportEntries",
      JSON.stringify(entries)
    );

    renderTable();

  }

}


renderTable();

</script>

</body>
</html>
